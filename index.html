<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ever After Events — Agence de Mariage Premium</title>
    <meta name="description" content="Ever After Events — Agence de mariage premium. Wedding Planner Intelligent, galerie, services, équipe, avis et contact." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script>document.documentElement.classList.add('theme-light')</script>
  </head>
  <body class="antialiased bg-[#FAF9F6] text-[#333333]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Temporary error-overlay to surface runtime errors on blank pages (remove in production) -->
    <script>
      (function(){
        function showError(message, stack){
          try{
            var id = 'ever-after-error-overlay'
            var existing = document.getElementById(id)
            if(existing) existing.remove()
            var el = document.createElement('div')
            el.id = id
            el.style.position = 'fixed'
            el.style.left = '12px'
            el.style.right = '12px'
            el.style.bottom = '12px'
            el.style.top = '12px'
            el.style.zIndex = 999999
            el.style.background = 'rgba(0,0,0,0.85)'
            el.style.color = '#fff'
            el.style.padding = '20px'
            el.style.borderRadius = '12px'
            el.style.overflow = 'auto'
            el.style.fontFamily = 'monospace'
            el.innerHTML = '<h2 style="margin-top:0">Erreur JavaScript détectée</h2>' + '<pre style="white-space:pre-wrap">' + (message || 'Erreur inconnue') + '\n\n' + (stack || '') + '</pre>' + '<div style="position:absolute;right:16px;top:12px"><button id="ever-after-error-close" style="background:#fff;color:#000;border:none;padding:6px 10px;border-radius:8px;cursor:pointer">Fermer</button></div>'
            document.body.appendChild(el)
            document.getElementById('ever-after-error-close').addEventListener('click', function(){ el.remove() })
          }catch(e){ console.error('failed to show overlay', e) }
        }

        window.addEventListener('error', function(e){
          try{ showError(e.message, e.error && e.error.stack ? e.error.stack : (e.filename+':'+e.lineno+':'+e.colno)) }catch(e){}
        })

        window.addEventListener('unhandledrejection', function(ev){
          var r = ev && ev.reason
          try{ showError(r && r.message ? r.message : String(r), r && r.stack ? r.stack : '') }catch(e){}
        })

        // also capture early errors before scripts load (fallback)
        window.addEventListener && window.addEventListener('load', function(){
          setTimeout(function(){
            if(!document.querySelector('#root') || document.getElementById('root').children.length === 0){
              // no rendered content — suggest checking console
              console.info('No DOM rendered inside #root yet. If the page is blank, open DevTools console for details.')
            }
          }, 600)
        })
      })()
    </script>
  </body>
</html>
